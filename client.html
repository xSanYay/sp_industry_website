        <!-- Modern CSS additions -->
        <style>
        :root {
            --primary-color: #1a56db;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-light: #f8fafc;
            --border-light: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
        }

        .page-title {
            background: var(--primary-color);
            color: white;
        }

        .page-title h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: var(--text-dark);
        }

        .page-title p {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        .testimonials-title h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            color: var(--primary-color);
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 600;
        }

        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            padding: 2rem 0;
        }

        .client-logo {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 0.5rem;
            padding: 1rem;
            transition: all 0.2s ease;
            height: 120px;
            width: 100%;
            object-fit: contain;
            filter: grayscale(50%);
        }

        .client-logo:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(26, 86, 219, 0.1);
            filter: grayscale(0%);
        }

        @media (max-width: 768px) {
            .clients-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 0.75rem;
            }
        }
        </style>
